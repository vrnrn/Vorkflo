name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release version and supported architecture
        id: version
        run: node scripts/check-release.mjs
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run release:mac
      - name: Exercise the release application
        run: node scripts/run-electron-smoke.mjs --packaged
      - name: Verify release canvas performance
        run: node scripts/run-electron-smoke.mjs --packaged --performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/Vorkflo-*-mac-arm64.dmg
            apps/desktop/release/Vorkflo-*-mac-arm64.zip
            apps/desktop/release/SHA256SUMS.txt
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release
          path: release
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "v${RELEASE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Vorkflo ${RELEASE_VERSION}" \
            --notes-file "docs/release/${RELEASE_VERSION}.md" \
            release/*.dmg release/*.zip release/SHA256SUMS.txt
